ипотеза"}, {"text": "Тревога участника: «это скрытая проверка меня». Если формат похож на тест с баллом, доверие падает, и ответы становятся осторожными.", "tag": "гипотеза"}, {"text": "Ожидание: обратная связь важнее интерфейса. Бот сам по себе ценности не создаёт — ценность в качестве разбора.", "tag": "гипотеза"}]}, "black": {"points": [{"text": "Главный риск — достоверность оценки и последствий, а не интерфейс. Несколько моделей, согласных между собой, не создают правильного ответа.", "tag": "факт"}, {"text": "Оценка может незаметно съехать с ролей, загрузки и зависимостей на суждение о личных качествах людей. Это этический и кадровый риск.", "tag": "гипотеза"}, {"text": "Данные: даже обезличенный снимок реальной задачи требует согласованного доступа; банковские и персональные данные нельзя отправлять во внешние модели и Telegram без отдельного разрешения.", "tag": "факт"}]}, "yellow": {"points": [{"text": "Если калибровка удаётся, получается редкий формат: разбор без единственного правильного ответа, сравнение вариантов и повтор с другим решением.", "tag": "гипотеза"}, {"text": "Ценность выше для руководителей, которые уже принимают решения, чем для новичков на тестах: им нужен разбор, а не оценка.", "tag": "гипотеза"}, {"text": "Условие успеха: экспертная калибровка и явная граница «не для аттестации». Без обоих пунктов ценность превращается в риск.", "tag": "гипотеза"}]}, "green": {"points": [{"text": "Один кейс, пройденный вручную в чате: без бота, без кода, без базы сценариев.", "tag": "гипотеза"}, {"text": "Модуль переговоров как отдельная дешёвая ветка: план разговора и ролевая репетиция, без симуляции последствий проекта.", "tag": "гипотеза"}, {"text": "Только вымышленные кейсы на первом этапе: для проверки метода корпоративные данные не нужны вообще.", "tag": "гипотеза"}]}}, "exchange": [{"from": "Белая", "to": "Чёрная", "q": "Ты говоришь об утечке корпоративных данных. В записях сказано, что данные не запрашивались и не загружались. На чём тогда основан риск?", "a": "На замысле расширения: он предполагает снимок реальной задачи. Сейчас риск не текущий, а проектный — он появляется вместе с интеграцией, а не с идеей.", "status": "факт: данных нет; риск относится к будущему модулю"}, {"from": "Чёрная", "to": "Жёлтая", "q": "Ты называешь ценность в безопасной тренировке. Что мешает участнику прочитать разбор как кадровую оценку?", "a": "Только явная граница применения и отчёт без оценок личности. Если этого нет, безопасная тренировка и кадровая аттестация выглядят для участника одинаково.", "status": "гипотеза"}, {"from": "Зелёная", "to": "Белая", "q": "Ты фиксируешь 20–35 часов на прототип. Входят ли в это калибровка с экспертами, без которой оценка недостоверна?", "a": "В карточке сказано, что прототип включает правила и калибровку рецензирования при участии эксперта. Часы и доступность самого эксперта не определены — это открытая часть оценки.", "status": "неизвестно"}], "verdict": {"recommendation": "проверить", "line": "Проверять стоит качество разбора на одном кейсе, а не строить бота.", "why": ["Назначение и формат проверяемы на одном кейсе без разработки и без данных компании.", "Цифра 20–35 часов относится к прототипу, но не доказывает главного — что разбор решений сопоставим с оценкой опытного руководителя.", "Расширения на реальные проекты и переговоры важны, но их нельзя оценивать раньше, чем проверен сам механизм обратной связи."], "not_means": ["Это не одобрение продукта и не инвестиционное решение.", "Это не инструмент аттестации и не основание для кадровых решений.", "Это не разрешение работать с реальными корпоративными данными."], "confirm": ["Совпадает ли модельный разбор с оценкой двух опытных руководителей на двух-трёх разных решениях одного кейса.", "Не читается ли формат как проверка человека, а не решения.", "Какие данные допустимы вообще — до любого расширения на реальные проекты."], "cheap_step": {"what": "Один письменный кейс на вымышленных данных: цель, срок, ограничения, три связанные проблемы. Пройти его с Павлом и ещё одним опытным руководителем, затем сравнить их разбор с модельным и записать расхождения.", "not_included": "без бота, без голоса, без корпоративных данных, без каталога сценариев и без автоматической оценки.", "reversible": "Обратимо: это текстовый документ и один разговор; обязательств и доступа к данным не возникает.", "hours_note": "Сохранённая предварительная оценка 20–35 человеко-часов относится к одному сценарному прототипу; ручная проверка кейса дешевле и в эту цифру не входит."}, "basis": {"facts": ["Идея сохранена, реализация не поручена.", "Главная сложность — достоверная оценка решений, а не интерфейс бота.", "Корпоративные данные сейчас не запрашивались; для реальных проектов нужны обезличивание, read-only и песочница."], "hypotheses": ["Что разбор без единственного правильного ответа будет полезнее теста.", "Что руководители захотят тренироваться на собственных типах ситуаций.", "Что три роли-рецензента дают достаточно разностороннюю картину."], "unknowns": ["Схемы данных, права доступа и срок интеграции.", "Доступность бота и распознавания голоса.", "Кто калибрует оценки и по какой рубрике."]}}}, {"id": "003", "title": "Идея + MVP в обмен на долю", "short": "Телескоп · модель 03", "status": "сохранено, реализация не поручена", "question": "Стоит ли строить модель «идея + MVP в обмен на долю» — и что должно быть определено раньше: предмет сделки, условия доли или проверка спроса?", "question_note": "Вопрос нейтральный: «сначала прояснить» — такой же допустимый ответ, как «проверять дальше».", "hats": {"blue": {"points": [{"text": "Решаем, что делать дальше с моделью: продолжать, отложить или сначала прояснить предмет сделки и условия.", "tag": null}, {"text": "Критерии: (1) понятно, что именно передаётся — идея, пакет документов или работающий MVP; (2) у продукта есть подтверждённая потребность покупателей; (3) условия доли не обещают выплат.", "tag": null}, {"text": "Чего в разборе нет: юридической формы, оценки стоимости, налогов, конкретных операторов и инвесторов.", "tag": null}]}, "white": {"points": [{"text": "Модель: концепция, MVP, способ реализации и предварительная потребность в деньгах в обмен на небольшую долю — «например, 5% по договорённости». Портфель 20–30 проектов — желаемый сценарий, не условие и не прогноз.", "tag": "факт", "src": "карточка 003"}, {"text": "Оценка 18–36 человеко-часов покрывает концепцию, описание MVP, грубый план инвестиций и первичные интервью. Она не включает разработку MVP, поиск капитала и юридическое оформление.", "tag": "факт", "src": "карточка 003"}, {"text": "«1:10:100» (идея : продукт : продажи) — эвристика из рассказа Павла, а не наблюдённая экономика; снижение затрат на продажи не подтверждено. Неизвестны предмет первого продукта, критерии отбора портфеля и готовность операторов.", "tag": "неизвестно", "src": "карточка 003"}]}, "red": {"points": [{"text": "Притягательность: не продавать голую идею, а разделить будущую ценность с тем, кто умеет исполнять.", "tag": "гипотеза"}, {"text": "Тревога: оператор прочитает 5% как плату «за презентацию» и предложит фиксированную сумму или откажется. Это интуиция о восприятии, разговоров с операторами не было.", "tag": "гипотеза"}, {"text": "Ожидание: ценность модели — в отборе и сопровождении, а не в количестве проектов. Большой портфель без отбора выглядит как склад презентаций.", "tag": "гипотеза"}]}, "black": {"points": [{"text": "Доля в компании не равна доле выручки и не гарантирует выплат: дивиденды, продажа доли, размывание, ликвидность и договорные права обсуждаются отдельно.", "tag": "факт"}, {"text": "Дешёвый прототип не доказывает спрос, низкую стоимость привлечения клиентов и готовность оператора дать долю — это две разные проверки, и обе обязательны.", "tag": "факт"}, {"text": "Портфель из 20–30 проектов требует отбора и сопровождения: кто и за чей счёт их ведёт — не определено. Уверенная презентация модели не создаёт доверия у инвестора.", "tag": "гипотеза"}]}, "yellow": {"points": [{"text": "Если оператор готов взять проект за долю, появляется путь участия без капитала — и для автора идеи, и как витрина возможностей «Телескопа».", "tag": "гипотеза"}, {"text": "Ценность растёт, если передаётся не идея, а частично проверенный пакет с планом и первыми интервью: снимается часть работы с исполнителя.", "tag": "гипотеза"}, {"text": "Условие успеха: спрос покупателей подтверждён отдельно от интереса оператора. Одно согласие не заменяет другое.", "tag": "гипотеза"}]}, "green": {"points": [{"text": "Вместо доли — фиксированная плата за пакет: сначала проверить, платят ли вообще за такой результат.", "tag": "гипотеза"}, {"text": "Один проект с одним оператором, без портфеля и без обещаний масштаба.", "tag": "гипотеза"}, {"text": "Процент от выручки с потолком вместо доли в компании — споров о размывании меньше, но условия требуют юридической проверки.", "tag": "гипотеза"}]}}, "exchange": [{"from": "Белая", "to": "Красная", "q": "Ты чувствуешь, что 5% прочитают как плату за презентацию. Есть ли хоть одно наблюдение, что операторы согласны на такие условия?", "a": "Нет. Разговоров с операторами не было, в источниках только желаемая конструкция. Это интуиция о восприятии, а не факт.", "status": "неизвестно"}, {"from": "Жёлтая", "to": "Чёрная", "q": "Ты говоришь, что доля может не стоить ничего. Разве сама возможность участвовать без капитала не создаёт ценность?", "a": "Создаёт опцион, а не доход. Опцион с неясными правами, без ликвидности и без покупателя доли оценивается близко к нулю — пока нет договора и спроса на долю.", "status": "гипотеза, юридически не проверено"}, {"from": "Зелёная", "to": "Белая", "q": "Можно ли использовать соотношение 1:10:100 как аргумент в разговоре с оператором или инвестором?", "a": "Нет. Это эвристика из рассказа Павла, наблюдённой экономики за ней нет; в источниках она помечена как гипотеза. Как аргумент она подорвёт доверие, если её проверить.", "status": "факт: помечена как гипотеза"}], "verdict": {"recommendation": "прояснить", "line": "Сначала определить, что именно является предметом сделки, — иначе проверка «возьмёт ли оператор» измерит не то.", "why": ["Предмет сделки не определён: «идея», «пакет документов» и «работающий MVP» — разные предложения с разной ценой для автора и для оператора.", "Проверка готовности оператора без этого определения даст шум: отказ может относиться к формулировке, а не к идее.", "Базовая посылка модели — «1:10:100» и удешевление продаж — является гипотезой, поэтому на ней нельзя строить аргументацию."], "not_means": ["Это не отказ от идеи и не приговор модели студии.", "Это не инвестиционное решение, не оценка стоимости и не обещание доходности.", "Это не юридическая консультация по доле, размыванию и правам."], "confirm": ["Что именно передаётся: описание, пакет с интервью, прототип — и что остаётся у автора.", "Какие права даёт доля и как они оформляются; чем доля отличается от процента выручки.", "Какой продукт и какой покупатель у первого пилота — до разговоров о проценте.", "Отдельно: есть ли потребность покупателей. Отдельно: готов ли компетентный оператор взять проект на таких условиях."], "cheap_step": {"what": "Одностраничное описание предмета сделки: что передаём, что оставляем, какие права обсуждаем. Затем два-три разговора с потенциальными операторами о формате — без предложения доли и без документов.", "not_included": "без разработки MVP, без юридических документов, без поиска инвесторов и без обещаний портфеля.", "reversible": "Обратимо: разговоры о формате не создают обязательств; страница правится после первых ответов.", "hours_note": "Сохранённая предварительная оценка 18–36 человеко-часов относится к концепции, описанию MVP, плану и первичным интервью — не к сделке и не к запуску компании."}, "basis": {"facts": ["Идея сохранена, реализация не поручена.", "5%, 20–30 проектов и «миллионные результаты» — желаемый сценарий, не условия и не прогноз.", "Доля не равна выручке и не гарантирует выплат."], "hypotheses": ["«1:10:100» и уд <script>
'use strict';
window.__errors=[];window.addEventListener('error',e=>window.__errors.push(e.message));window.addEventListener('unhandledrejection',e=>window.__errors.push(String(e.reason)));
const DATA=JSON.parse(document.getElementById('content-data').textContent),ideas=DATA.ideas;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function inline(s){return esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/\[([^\]]+)\]\(([^)]+)\)/g,(all,t,u)=>/^https?:\/\//.test(u)?'<a href="'+u+'" target="_blank" rel="noopener">'+t+'</a>':t+' <code>('+u+')</code>');}
function md(s){let out='',para=[],list=null;function flush(){if(para.length){out+='<p>'+inline(para.join(' '))+'</p>';para=[]}}function close(){if(list){out+='</'+list+'>';list=null}}for(const line of s.split('\n')){if(!line.trim()){flush();close();continue}let m=line.match(/^(?:- |(\d+)\. )(.+)/);if(m){flush();let kind=m[1]?'ol':'ul';if(list!==kind){close();out+='<'+kind+'>';list=kind}out+='<li>'+inline(m[2])+'</li>'}else{close();let h=line.match(/^#{1,3} (.+)/);if(h){flush();out+='<h3>'+inline(h[1])+'</h3>'}else para.push(line)}}flush();close();return out;}

function topLine(label){return '<div class="topline"><span>Хранилище идей / '+label+'</span><span class="state">Бэклог · не реализуется</span></div>'}

function fmtSize(n){if(n<1024)return n+' Б';if(n<1048576)return (n/1024).toFixed(n<10240?1:0).replace('.',',')+' КБ';return (n/1048576).toFixed(1).replace('.',',')+' МБ'}
function artItems(list){return '<ul class="art-items">'+list.map(a=>'<li><a href="'+esc(a.href)+'" target="_blank" rel="noopener">'+esc(a.title)+'</a><span class="art-meta">'+(a.idea?'<span class="art-idea">идея '+esc(a.idea)+' ·</span>':'')+esc(a.kind)+' · '+fmtSize(a.size)+' · '+esc(a.bundle_label)+'</span></li>').join('')+'</ul>'}
function artifactsBlock(x){const mine=(DATA.artifacts||[]).filter(a=>a.idea===x.id);const body=mine.length?'<p>Материалы отдельных проработок по этой идее. Сборка копирует существующие файлы в <code>site/artifacts/</code> и печатает ссылки только на эти копии.</p><p class="art-source">Пересборка заново сканирует <code>artifacts/</code>: новый файл появится здесь сам, удалённый — исчезнет вместе с копией.</p>'+artItems(mine):'<p class="compact-note">Файлов по этой идее пока нет. Раздел заполнится при следующей сборке, если в <code>artifacts/</code> появятся материалы с пометкой идеи '+x.id+' — в manifest.json или в имени файла.</p>';return block('artifacts','Прикреплённые артефакты',body)}
function artifactsHome(){const all=DATA.artifacts||[];if(!all.length)return block('artifacts','Прикреплённые артефакты','<p class="compact-note">Пока пусто: сборка не нашла файлов в <code>artifacts/</code>. Раздел наполняется сам при пересборке — ссылки появляются только на реально скопированные файлы.</p>');const order=[],groups={};all.forEach(a=>{if(!groups[a.bundle_label]){groups[a.bundle_label]=[];order.push(a.bundle_label)}groups[a.bundle_label].push(a)});return block('artifacts','Прикреплённые артефакты','<p>Расчёты и презентации, подготовленные отдельными проработками. Сборка копирует каждый существующий файл в <code>site/artifacts/</code> и сверяет контрольную сумму.</p>'+order.map(k=>'<h3>'+esc(k)+'</h3>'+artItems(groups[k])).join(''))}
function row(x){return '<a class="idea-row" href="#/idea/'+x.id+'"><span class="number">'+x.id+'</span><div><h2>'+esc(x.title)+'</h2><p>'+esc(x.summary)+'</p><div class="row-tags">Замысел Павла · сохранён предварительный разбор</div></div><div class="estimate"><strong>'+x.hours+'</strong>'+x.scope+'<span class="arrow" aria-hidden="true">↗</span></div></a>'}
function home(){document.title='Хранилище идей — Телескоп';document.getElementById('main').innerHTML=topLine('коллекция')+'<header class="page-head"><div class="eyebrow">Идеи, к которым стоит вернуться</div><h1>Сохранить мысль.<br>Увидеть её целиком.</h1><p class="lead">Идеи Павла — с уточнениями, предварительными оценками и открытыми вопросами. Не план работ, а место для осмысленного выбора.</p></header><div class="toolbar"><label id="count">Оглавление · '+ideas.length+' идеи</label><div class="search"><input id="search" type="search" aria-label="Найти идею по всему тексту" placeholder="Найти в идеях…"></div></div><div class="catalog" id="catalog">'+ideas.map(row).join('')+'</div><p class="compact-note">Часы — предварительная трудоёмкость разных проверочных объёмов, не рейтинг идей и не календарные сроки. Границы каждой оценки — внутри.</p>'+artifactsHome()+'<section class="method"><h2>Как устроен разбор</h2><p>Роли — понятная последовательность работы, а не скрытый запуск нескольких агентов.</p><div class="roles"><div><h3>01 / Секретарь</h3><p>Сохраняет замысел и уточнения Павла. Предложения помощника держит отдельно.</p></div><div><h3>02 / Критик</h3><p>Проверяет смысл, допущения и риски. Ищет дешёвый способ проверить главное.</p></div><div><h3>03 / Сметчик</h3><p>Очерчивает минимальный путь, инструменты и трудозатраты — с оговорками.</p></div></div><div class="notice">На страницах доступны «Экспертный совет» и «Выводы». Разборы по шести шляпам добавляются отдельно: если для новой идеи их ещё нет, это явно отмечено. Сохранённый разбор одной модели DeepSeek — не шесть независимых экспертов и не объективный рейтинг.</div><details><summary>Правила хранилища · исходный README</summary><pre>'+esc(DATA.readme)+'</pre></details></section>'+foot();document.getElementById('search').addEventListener('input',e=>{let q=e.target.value.trim().toLocaleLowerCase('ru');let found=ideas.filter(x=>(x.title+' '+x.raw+' '+x.concept).toLocaleLowerCase('ru').includes(q));document.getElementById('catalog').innerHTML=found.length?found.map(row).join(''):'<p class="empty">Ничего не найдено. Попробуйте другое слово.</p>';document.getElementById('count').textContent='Найдено: '+found.length+' из '+ideas.length;});}

function detail(x){document.title=x.title+' — Телескоп';const get=t=>x.sections.find(s=>s.title===t)?.body||'';let assessment=x.sections.find(s=>s.title.includes('Маленькая предварительная оценка')||s.title==='Независимая предварительная оценка')?.body||'';let summary=get('Резюме замысла Павла');let extensions=x.sections.filter(s=>s.title.startsWith('Расширение'));let limitations=get('Ограничения')||get('Важные разграничения');let connection=get('Связь');let how=x.id==='001'?'Каталог показывает ещё не реализованные идеи и путь к ним. В первом проекте посетитель выбирает выставку и картину, а команда изучает технологический паспорт съедобной интерпретации. ИИ предлагает варианты; шеф и технолог проверяют их опытной готовкой.':x.id==='002'?'Кейс задаёт роль, цель, срок и ограничения. Игрок изучает факты, уточняет неизвестное и предлагает действия. Правила меняют состояние сценария, роли-рецензенты разбирают последствия и альтернативы. Реальные проекты и переговоры — расширения этой идеи, а не готовые модули.':'Выбрать идею → проверить спрос покупателей и интерес будущего оператора → подготовить концепцию, минимальный продукт и план реализации → отдельно договориться о правах и доле. Портфель и доходность остаются гипотезой, а не результатом.';
if(x.id==='004'){how='Открыть каталог на телевизоре с браузером и интернетом, выбрать свою песню Suno и петь по крупному синхронному тексту. Управление: пуск/пауза, громкость, тональность и включение/выключение вокала. Телефонный пульт не обязателен; совместимость проверяется на конкретных телевизорах.';extensions=x.sections.filter(s=>!['Резюме замысла Павла','Что здесь главное','Независимая предварительная оценка'].includes(s.title));limitations='Совместимость браузеров TV, переключение вокала, изменение тональности без изменения темпа и точность текста ещё не проверены. Старые оценки относятся к раннему варианту и не покрывают уточнённый плеер; генерация песен и расход кредитов не запускались.';}
let sections=block('brief','Кратко',md(summary),'ЗАМЫСЕЛ ПАВЛА')+block('meaning','Смысл',md(get('Что здесь главное')),'ЗАМЫСЕЛ ПАВЛА')+block('how','Как работает','<p>'+esc(how)+'</p><p class="compact-note">Редакционное изложение сохранённых записей; не дополнительные функции и не поручение на реализацию.</p>');
sections+=block('assessment','Предварительная оценка','<div class="report-label"><span>Сохранённый независимый разбор · DeepSeek</span><span>Уверенность низкая</span></div><div class="scope"><strong>'+x.hours+'</strong><span>'+x.scope+'</span><p>Человеко-часы, не обещание срока или стоимости. Полные допущения и исключения — ниже.</p></div>'+md(assessment)+(x.id==='002'?'<div class="notice">20–35 ч не включают корпоративные интеграции, проверку прав, очистку данных, защищённое развёртывание и голос. Числовая смета модуля переговоров не рассчитана.</div>':'')+'<p class="compact-note">Реализуемость: предварительная гипотеза до дешёвой проверки. Подтверждённой денежной сметы нет; без тарифов и согласованного объёма её нельзя вывести из часов.</p>');
sections+=councilBlocks(x);sections+=artifactsBlock(x);sections+=block('risks','Риски и границы',md(limitations));
let additions=extensions.map(s=>'<h3>'+esc(s.title.replace('Расширение замысла: ',''))+'</h3>'+md(s.body)).join('');if(connection)additions+='<h3>Связь с другими идеями</h3>'+md(connection);
if(x.concept){additions+='<h3>Развёрнутая концептуальная запись</h3><p class="compact-note">Дополнительный контекст из ранней записи. Здесь смешаны исходный замысел, проектные гипотезы и предложения помощника. Карточка идеи выше имеет приоритет; предлагаемый объём не означает утверждённые требования.</p>'+(x.id==='002'?'<div class="notice">«Штаб» — предложенное, не утверждённое название. 10–15 шаблонов, три уровня сложности и состав ролей — предложения помощника, не готовность продукта и не объём оценки 20–35 ч.</div>':'<div class="notice">Одна выставка, три блюда и интерьер — раннее предложение объёма. Оценка 10–18 ч относится к небольшому концептуальному прототипу первого экспоната, не ко всей выставке и не к ресторану.</div>');additions+=x.extras.map(s=>'<details><summary>'+esc(s.title)+'</summary><div class="inside">'+md(s.body)+'</div></details>').join('');}

let lastRoute='';function route(){const parts=location.hash.replace(/^#\/?/,'').split('/');const id=parts[0]==='idea'?parts[1]:null;const x=ideas.find(x=>x.id===id);const key=x?x.id:'home';if(lastRoute!==key){if(x)detail(x);else home();lastRoute=key;document.querySelectorAll('[data-route]').forEach(a=>{a.classList.toggle('active',a.dataset.route===key);if(a.dataset.route===key)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});window.scrollTo(0,0);document.querySelector('.mobile-menu details').open=false;}if(x&&parts[2]){let target=document.getElementById(parts[2]);if(target)window.scrollTo({top:target.getBoundingClientRect().top+window.scrollY-25,behavior:'instant'})}else window.scrollTo(0,0);}
